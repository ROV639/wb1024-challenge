<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>表情包兵工厂 · 3 步出一张</title>
<style>
  :root{
    --paper:#F4F1E8; --ink:#16161A; --ink2:#5A5A64; --line:#DDD6C4;
    --hazard:#FFB800; --hazard-d:#C68F00; --red:#C0392B; --card:#FFFDF6;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  body{min-height:100dvh;padding-bottom:40px}

  /* ── 顶栏：印刷厂招牌 ── */
  .top{border-bottom:3px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
  .top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:10px;background:var(--hazard);
    display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:3px 3px 0 var(--ink);flex-shrink:0}
  .tt b{font-size:19px;letter-spacing:.01em;display:block;line-height:1.2}
  .tt span{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.08em}
  .stamp{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--red);
    border:2px solid var(--ink);border-radius:6px;padding:4px 10px;transform:rotate(3deg);box-shadow:2px 2px 0 var(--ink);white-space:nowrap}

  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
  @media (max-width:860px){ .wrap{grid-template-columns:1fr} }

  /* ── 画布区：相纸+裁切孔 ── */
  .stage{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:14px;position:relative}
  .stage::before,.stage::after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink);transform:translateY(-50%)}
  .stage::before{left:-7px} .stage::after{right:-7px}
  canvas{width:100%;height:auto;display:block;border:2px solid var(--ink);border-radius:8px;touch-action:none;cursor:grab;background:#fff}
  canvas:active{cursor:grabbing}
  .stage-tip{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:center;margin-top:10px;letter-spacing:.03em}

  /* ── 控制台 ── */
  .panel{display:flex;flex-direction:column;gap:16px}
  .blk{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:14px 15px}
  .blk h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .blk h3 i{font-style:normal;font-family:var(--mono);font-size:10px;background:var(--ink);color:var(--paper);border-radius:4px;padding:2px 6px;letter-spacing:.05em}
  .blk h3 em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ink2);font-weight:400}

  .tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tpl{border:2px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;padding:6px 4px 5px;font-family:var(--sans);transition:transform .12s}
  .tpl .sw{height:38px;border-radius:5px;border:1.5px solid var(--ink);margin-bottom:4px;position:relative;overflow:hidden}
  .tpl b{font-size:12px;font-weight:600;display:block;text-align:center}
  .tpl.on{background:var(--hazard);box-shadow:2.5px 2.5px 0 var(--ink);transform:translate(-1px,-1px)}
  .tpl:active{transform:scale(.96)}

  .fld{margin-bottom:10px}
  .fld label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink2);margin-bottom:4px;letter-spacing:.04em}
  .fld input{width:100%;border:2px solid var(--ink);border-radius:9px;padding:10px 12px;font-size:15px;font-family:var(--sans);background:#fff;outline:none}
  .fld input:focus{border-color:var(--hazard-d);box-shadow:0 0 0 3px rgba(255,184,0,.35)}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:transform .1s}
  .chip:hover{background:var(--hazard)}
  .chip:active{transform:scale(.94)}
  .cat-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:9px;-webkit-overflow-scrolling:touch}
  .cat-row::-webkit-scrollbar{display:none}
  .cat{border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:12px;background:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:var(--sans)}
  .cat.on{background:var(--ink);color:var(--paper);font-weight:600}

  .acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .btn{border:2.5px solid var(--ink);border-radius:11px;padding:12px 8px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);background:#fff;transition:transform .1s}
  .btn:active{transform:translate(2px,2px);box-shadow:none}
  .btn-primary{background:var(--hazard);box-shadow:3px 3px 0 var(--ink);grid-column:1/-1;font-size:17px;padding:14px 8px}
  .btn-gh{box-shadow:3px 3px 0 var(--ink)}
  .btn-gh:active{box-shadow:none}

  .foot{max-width:1080px;margin:26px auto 0;padding:0 16px;font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:center;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);
    padding:10px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:860px){ .stage{box-shadow:4px 4px 0 var(--ink)} }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">🏭</div>
    <div class="tt"><b>表情包兵工厂</b><span>MEME FOUNDRY · EST.1024</span></div>
    <div class="stamp">今日出厂 ✦ 无限量</div>
  </div>
</header>

<main class="wrap">
  <!-- 左：画布 -->
  <section class="stage">
    <canvas id="cv" width="1080" height="1080" aria-label="表情包预览画布"></canvas>
    <p class="stage-tip">画布上直接拖动文字挪位置 · 出厂即 1080×1080 PNG</p>
  </section>

  <!-- 右：控制台 -->
  <section class="panel">
    <div class="blk">
      <h3><i>STEP 1</i>选底版<em>点一下切换</em></h3>
      <div class="tpls" id="tpls"></div>
    </div>

    <div class="blk">
      <h3><i>STEP 2</i>写两句<em>点右侧锦囊直接填</em></h3>
      <div class="fld">
        <label><span>上联 · TOP</span><span id="fillHint">锦囊填入 → 上联</span></label>
        <input id="topText" maxlength="60" placeholder="例：我不是针对你">
      </div>
      <div class="fld">
        <label><span>下联 · BOTTOM</span><span></span></label>
        <input id="botText" maxlength="60" placeholder="例：我是说在座的各位">
      </div>
      <div class="cat-row" id="cats"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="blk">
      <h3><i>STEP 3</i>出厂<em>PNG 直存手机相册</em></h3>
      <div class="acts">
        <button class="btn btn-primary" id="saveBtn">💾 保存 PNG</button>
        <button class="btn btn-gh" id="luckyBtn">🎲 手气不错</button>
        <button class="btn btn-gh" id="clearBtn">🧹 清空重来</button>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  全部在本机浏览器完成 · 模板均为代码绘制，无版权风险 · 1024 程序员节造物挑战参赛作品<br>
  使用 WorkBuddy 制作 · 可分享给朋友，请勿用于攻击他人
</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var topInput = document.getElementById('topText'), botInput = document.getElementById('botText');
  var fillHint = document.getElementById('fillHint');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  /* ── 模板定义：全部代码绘制 ── */
  var TEMPLATES = [
    {id:'classic', name:'经典黑白', draw:function(c){
      c.fillStyle='#F2EFE6'; c.fillRect(0,0,W,H);
      c.strokeStyle='rgba(0,0,0,.05)'; c.lineWidth=2;
      for(var x=60;x<W;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
      for(var y=60;y<H;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
      return {style:'ink'};
    }},
    {id:'hazard', name:'警示条纹', draw:function(c){
      c.fillStyle='#191920'; c.fillRect(0,0,W,H);
      c.save(); c.beginPath(); c.rect(0,0,W,H); c.clip();
      var band=34;
      c.fillStyle='#191920'; c.fillRect(0,0,W,H);
      c.fillStyle='#FFB800';
      for(var i=-H;i<W+H;i+=band*2){c.beginPath();c.moveTo(i,0);c.lineTo(i+band,0);c.lineTo(i+band+H,H);c.lineTo(i+H,H);c.closePath();c.fill();}
      c.restore();
      c.fillStyle='#191920'; c.fillRect(70,70,W-140,H-140);
      c.strokeStyle='#FFB800'; c.lineWidth=5; c.strokeRect(84,84,W-168,H-168);
      return {style:'hazard'};
    }},
    {id:'bubble', name:'对话框', draw:function(c){
      var g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0E3B33'); g.addColorStop(1,'#08231D');
      c.fillStyle=g; c.fillRect(0,0,W,H);
      var bx=90,by=140,bw=W-180,bh=H-300;
      c.fillStyle='#F7F4EA';
      c.beginPath();
      if(c.roundRect) c.roundRect(bx,by,bw,bh,54); else c.rect(bx,by,bw,bh);
      c.fill();
      c.beginPath(); c.moveTo(bx+90,by+bh); c.lineTo(bx+40,by+bh+70); c.lineTo(bx+190,by+bh); c.closePath(); c.fill();
      return {style:'ink'};
    }, def:{top:0.26, bot:0.72}},
    {id:'award', name:'奖状红', draw:function(c){
      c.fillStyle='#FBF3DC'; c.fillRect(0,0,W,H);
      c.strokeStyle='#B03A2E'; c.lineWidth=10; c.strokeRect(34,34,W-68,H-68);
      c.strokeStyle='#C9A227'; c.lineWidth=3; c.strokeRect(58,58,W-116,H-116);
      c.fillStyle='#B03A2E'; c.font='700 64px '+FONT;
      c.textAlign='center'; c.textBaseline='middle';
      c.fillText('特 等 奖', W/2, 132);
      c.font='700 30px '+FONT; c.fillStyle='#C9A227';
      c.fillText('★ 表情包兵工厂 颁 ★', W/2, H-108);
      return {style:'red'};
    }, def:{top:0.32, bot:0.60}},
    {id:'kraft', name:'拍纸板', draw:function(c){
      c.fillStyle='#B08958'; c.fillRect(0,0,W,H);
      c.strokeStyle='rgba(255,255,255,.10)'; c.lineWidth=16;
      for(var y=0;y<H;y+=46){c.beginPath();c.moveTo(0,y);c.bezierCurveTo(W*0.3,y+14,W*0.6,y-14,W,y);c.stroke();}
      c.strokeStyle='#8A5A33'; c.lineWidth=6; c.strokeRect(30,30,W-60,H-60);
      return {style:'white'};
    }}
  ];
  /* 上传底版单独处理（无图时只是占位提示） */
  function drawUpload(c){
      c.fillStyle='#222'; c.fillRect(0,0,W,H);
      if(state.img){ drawCover(c,state.img); c.fillStyle='rgba(0,0,0,.28)'; c.fillRect(0,0,W,H); }
      else { c.fillStyle='#3A3A42'; c.font='700 44px '+FONT; c.textAlign='center'; c.textBaseline='middle'; c.fillText('先点右侧「我的图」上传', W/2, H/2); }
      return {style:'white'};
  }
  var FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

  function drawCover(c,img){
    var s = Math.max(W/img.width, H/img.height), iw=img.width*s, ih=img.height*s;
    c.drawImage(img, (W-iw)/2, (H-ih)/2, iw, ih);
  }

  /* ── 状态 ── */
  var state = {
    tpl: 'classic',
    img: null,
    top:  {x:0.5, y:0.14, size:0},
    bot:  {x:0.5, y:0.86, size:0},
    lastFocus:'top'
  };

  function applyTplDefaults(id){
    var t=TEMPLATES.filter(function(x){return x.id===id;})[0];
    var d=(t&&t.def)||{top:0.14,bot:0.86};
    state.top.y=d.top; state.bot.y=d.bot;
  }

  /* ── 模板 UI ── */
  var tplsEl = document.getElementById('tpls');
  TEMPLATES.forEach(function(t){
    var b=document.createElement('button');
    b.className='tpl'+(t.id===state.tpl?' on':'');
    b.dataset.id=t.id;
    b.innerHTML='<div class="sw" data-sw="'+t.id+'"></div><b>'+t.name+'</b>';
    b.onclick=function(){ state.tpl=t.id; state.img=null; applyTplDefaults(t.id); syncTplUI(); render(); };
    tplsEl.appendChild(b);
    paintSwatch(b.querySelector('.sw'), t.id);
  });
  function paintSwatch(el,id){
    var st={
      classic:'linear-gradient(135deg,#F2EFE6 60%,#16161A 60%)',
      hazard:'repeating-linear-gradient(45deg,#FFB800 0 10px,#191920 10px 20px)',
      bubble:'linear-gradient(135deg,#0E3B33 55%,#F7F4EA 55%)',
      award:'linear-gradient(135deg,#FBF3DC 55%,#B03A2E 55%)',
      kraft:'linear-gradient(135deg,#B08958 55%,#F7F4EA 55%)',
      upload:'linear-gradient(135deg,#3A3A42 55%,#8E8E96 55%)'
    };
    el.style.background=st[id]||'#fff';
  }
  function syncTplUI(){
    tplsEl.querySelectorAll('.tpl').forEach(function(b){ b.classList.toggle('on', b.dataset.id===state.tpl); });
  }

  /* ── 锦囊（梗句库） ── */
  var POUCH = {
    '打工人':['这个班是一天也不想上了','工资到位，一切都好说','已阅，不改','收到，好的，没问题','在做了在做了（新建文件夹）','钱是老板的，命是自己的','月底吃土选手','今晚不加班，谢谢'],
    '大厂黑话':['咱们对齐一下颗粒度','这个事要找抓手','顶层设计，底层逻辑','形成组合拳，打通链路','先沉淀，再复盘，最后闭环','这个痛点很痛','赋能业务，倒逼成长','拉个通，把事情落地'],
    '破防瞬间':['我裂开了','蚌埠住了','破防了，家人们','精神状态良好（存疑）','emo 浓度超标','已黑化，勿扰','别问，问就是不会','我不理解，但我大受震撼'],
    '社交悍匪':['漏！大漏特漏！','尊嘟假嘟？','阿巴阿巴阿巴','无所谓，我会出手','不要慌，问题不大','谢主隆恩','打住，再说就不礼貌了','I 人做错了什么'],
    '已读乱回':['下次一定','先帝创业未半而中道崩殂','查无此人','有事启奏，无事退朝','时间管理大师','已读，乱回','在路上了（并没有）','本人已死，有事烧纸']
  };
  var curCat='打工人';
  var catsEl=document.getElementById('cats'), chipsEl=document.getElementById('chips');
  Object.keys(POUCH).forEach(function(cat){
    var b=document.createElement('button');
    b.className='cat'+(cat===curCat?' on':''); b.textContent=cat;
    b.onclick=function(){ curCat=cat; syncCatUI(); renderChips(); };
    catsEl.appendChild(b);
  });
  function syncCatUI(){
    catsEl.querySelectorAll('.cat').forEach(function(b){ b.classList.toggle('on', b.textContent===curCat); });
  }
  function renderChips(){
    chipsEl.innerHTML='';
    POUCH[curCat].forEach(function(p){
      var b=document.createElement('button');
      b.className='chip'; b.textContent=p;
      b.onclick=function(){
        var target = state.lastFocus==='bot' ? botInput : topInput;
        target.value=p;
        if(state.lastFocus==='bot'){ state.lastFocus='top'; fillHint.textContent='锦囊填入 → 上联'; }
        else { state.lastFocus='bot'; fillHint.textContent='锦囊填入 → 下联'; }
        render();
      };
      chipsEl.appendChild(b);
    });
  }
  topInput.addEventListener('focus',function(){ state.lastFocus='top'; fillHint.textContent='锦囊填入 → 上联'; });
  botInput.addEventListener('focus',function(){ state.lastFocus='bot'; fillHint.textContent='锦囊填入 → 下联'; });
  topInput.addEventListener('input',render);
  botInput.addEventListener('input',render);

  /* ── 上传我的图 ── */
  var uploadBtn=document.createElement('button');
  uploadBtn.className='tpl'; uploadBtn.dataset.id='upload';
  uploadBtn.innerHTML='<div class="sw" data-sw="upload"></div><b>我的图</b>';
  uploadBtn.onclick=function(){ pickFile.click(); };
  tplsEl.appendChild(uploadBtn);
  paintSwatch(uploadBtn.querySelector('.sw'),'upload');
  var pickFile=document.createElement('input');
  pickFile.type='file'; pickFile.accept='image/*'; pickFile.style.display='none';
  document.body.appendChild(pickFile);
  pickFile.onchange=function(){
    var f=pickFile.files&&pickFile.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ toast('只认 JPG / PNG 图片哦'); return; }
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){ state.img=im; state.tpl='upload'; applyTplDefaults('upload'); syncTplUI(); render(); toast('底版已换成你的图'); };
      im.onerror=function(){ toast('图片读取失败，换一张试试'); };
      im.src=rd.result;
    };
    rd.onerror=function(){ toast('图片读取失败，换一张试试'); };
    rd.readAsDataURL(f);
    pickFile.value='';
  };

  /* ── 渲染 ── */
  function render(){
    var st;
    if(state.tpl==='upload'){ st=drawUpload(ctx); }
    else {
      var tpl=TEMPLATES.filter(function(t){return t.id===state.tpl;})[0]||TEMPLATES[0];
      st=tpl.draw(ctx)||{style:'ink'};
    }
    drawBlock(state.top, topInput.value||'', st.style, true);
    drawBlock(state.bot, botInput.value||'', st.style, false);
  }

  function drawBlock(blk, text, style, isTop){
    if(!text) return;
    var pad = W*0.09;
    var maxW = W - pad*2;
    var maxH = H*0.30;
    var size = 96;
    var lines = wrap(text, size, maxW);
    while((lines.length*size*1.16 > maxH) && size>26){ size-=4; lines=wrap(text,size,maxW); }
    while(lines.length>1 && measureWidest(lines,size) > maxW && size>26){ size-=4; lines=wrap(text,size,maxW); }
    blk.size=size;
    ctx.font='800 '+size+'px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    var cx=blk.x*W, cy=blk.y*H, lh=size*1.16;
    var startY=cy-(lines.length-1)*lh/2;
    lines.forEach(function(line,i){
      var y=startY+i*lh;
      if(style==='ink'){
        ctx.lineWidth=Math.max(3,size/14); ctx.strokeStyle='#F2EFE6';
        ctx.strokeText(line,cx,y);
        ctx.fillStyle='#16161A'; ctx.fillText(line,cx,y);
      } else if(style==='red'){
        ctx.lineWidth=Math.max(3,size/16); ctx.strokeStyle='#7A1F14';
        ctx.strokeText(line,cx,y);
        ctx.fillStyle='#B03A2E'; ctx.fillText(line,cx,y);
      } else {
        ctx.lineWidth=Math.max(4,size/8); ctx.strokeStyle='#101014';
        ctx.strokeText(line,cx,y);
        ctx.fillStyle= style==='hazard' ? '#FFB800' : '#FFFFFF';
        ctx.fillText(line,cx,y);
      }
    });
  }
  function wrap(text,size,maxW){
    ctx.font='800 '+size+'px '+FONT;
    var lines=[], cur='';
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(ch==='\n'){ lines.push(cur); cur=''; continue; }
      if(ctx.measureText(cur+ch).width>maxW && cur){ lines.push(cur); cur=ch; }
      else cur+=ch;
    }
    if(cur) lines.push(cur);
    return lines;
  }
  function measureWidest(lines,size){
    ctx.font='800 '+size+'px '+FONT;
    var m=0; lines.forEach(function(l){ m=Math.max(m,ctx.measureText(l).width); });
    return m;
  }

  /* ── 拖拽 ── */
  var drag=null;
  function canvasPos(e){
    var r=cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
  }
  function hit(e){
    var p=canvasPos(e), cands=[['top',state.top],['bot',state.bot]];
    for(var i=cands.length-1;i>=0;i--){
      var b=cands[i][1];
      if(!b.size) continue;
      if(Math.abs(p.x-b.x)<0.42 && Math.abs(p.y-b.y)<0.16) return cands[i][0];
    }
    return null;
  }
  cv.addEventListener('pointerdown',function(e){
    var h=hit(e); if(!h) return;
    drag={key:h}; cv.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!drag) return;
    var p=canvasPos(e);
    state[drag.key].x=Math.min(0.92,Math.max(0.08,p.x));
    state[drag.key].y=Math.min(0.94,Math.max(0.06,p.y));
    render();
  });
  ['pointerup','pointercancel'].forEach(function(t){
    cv.addEventListener(t,function(){ drag=null; });
  });

  /* ── 动作 ── */
  document.getElementById('luckyBtn').onclick=function(){
    var cats=Object.keys(POUCH), a=cats[Math.floor(Math.random()*cats.length)], b2=cats[Math.floor(Math.random()*cats.length)];
    topInput.value=POUCH[a][Math.floor(Math.random()*POUCH[a].length)];
    botInput.value=POUCH[b2][Math.floor(Math.random()*POUCH[b2].length)];
    render(); toast('手气不错，已填好上下联');
  };
  document.getElementById('clearBtn').onclick=function(){
    topInput.value=''; botInput.value=''; render(); toast('已清空，重新造');
  };
  document.getElementById('saveBtn').onclick=function(){
    if(!topInput.value && !botInput.value){ toast('先写两句，再出厂'); topInput.focus(); return; }
    try{
      cv.toBlob(function(blob){
        if(!blob){ toast('导出失败，请重试'); return; }
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='表情包兵工厂-'+Date.now()+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
        toast('已出厂，去相册看看');
      },'image/png');
    }catch(err){ toast('导出失败：'+err.message); }
  };

  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('on');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('on'); },1800);
  }

  renderChips();
  render();
})();
</script>
</body>
</html>
